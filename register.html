<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Festivo</title>
  <meta name="description" content="Create your Festivo account to get exclusive offers, track orders, and enjoy a personalised shopping experience.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    .auth-page { min-height: 100vh; background: linear-gradient(135deg, #fdf0f2 0%, #f8f3ff 50%, #fff8ed 100%); display: flex; flex-direction: column; }
    .auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
    .auth-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); padding: 2.5rem; width: 100%; max-width: 480px; }
    .auth-logo { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; }
    .auth-heading { font-family: var(--font-serif); font-size: var(--font-size-3xl); font-weight: 700; text-align: center; color: var(--text-dark); margin-bottom: 0.375rem; }
    .auth-subtitle { text-align: center; font-size: var(--font-size-sm); color: var(--muted); margin-bottom: 1.75rem; }
    /* ── input-group: flex row so the absolute icon is reliably centred ── */
    .input-group {
      display: flex;
      align-items: center;
      position: relative;
    }
    .input-group .input-icon {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      color: var(--muted);
      font-size: 1rem;
      z-index: 1;
    }
    .input-group .form-control {
      padding-left: 2.75rem;
      flex: 1;
    }

    /* ── password-field: flex so toggle-pw is reliably centred ── */
    .password-field { position: relative; display: flex; align-items: center; }
    .password-field .form-control { flex: 1; padding-left: 1rem; padding-right: 2.75rem; }
    .password-field .toggle-pw {
      position: absolute;
      right: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
      transition: color var(--transition-fast);
      z-index: 1;
    }
    .password-field .toggle-pw:hover { color: var(--primary); }
    /* Password strength */
    .strength-bar { display: flex; gap: 3px; margin-top: 0.5rem; }
    .strength-bar-seg { height: 4px; flex: 1; border-radius: var(--radius-full); background: var(--border); transition: background var(--transition); }
    .strength-bar-seg.weak   { background: var(--danger); }
    .strength-bar-seg.fair   { background: var(--warning); }
    .strength-bar-seg.good   { background: var(--info); }
    .strength-bar-seg.strong { background: var(--success); }
    .strength-label { font-size: var(--font-size-xs); margin-top: 0.25rem; font-weight: 600; }
    .strength-label.weak   { color: var(--danger); }
    .strength-label.fair   { color: var(--warning); }
    .strength-label.good   { color: var(--info); }
    .strength-label.strong { color: var(--success); }
    /* Terms */
    .terms-check { display: flex; align-items: flex-start; gap: 0.625rem; margin-bottom: 1.5rem; }
    .terms-check .form-check-input { margin-top: 0.2rem; }
    .terms-check .form-check-label { font-size: var(--font-size-sm); color: var(--text); }
    .auth-footer-link { text-align: center; font-size: var(--font-size-sm); color: var(--muted); margin-top: 1.5rem; }
    .auth-footer-link a { color: var(--primary); font-weight: 600; }
    .auth-footer-link a:hover { text-decoration: underline; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media(max-width:540px){ .grid-2 { grid-template-columns: 1fr; } }
    .perks-strip { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin-bottom: 1.75rem; }
    .perk-item { text-align: center; padding: 0.75rem 0.5rem; background: var(--light); border-radius: var(--radius-md); }
    .perk-item i { font-size: 1.25rem; color: var(--primary); display: block; margin-bottom: 0.375rem; }
    .perk-item span { font-size: 0.7rem; font-weight: 600; color: var(--muted); line-height: 1.3; display: block; }
  </style>
</head>
<body class="auth-page">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Minimal Auth Header -->
  <header style="background:var(--white);border-bottom:1px solid var(--border);padding:1rem 1.5rem;">
    <div style="max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;">
      <a href="index.html" class="site-logo">
        <div class="logo-icon"><i class="bi bi-stars"></i></div>
        <span class="logo-text">Festi<span class="accent">vo</span></span>
      </a>
      <div style="display:flex;align-items:center;gap:1rem;">
        <button class="hdr-btn theme-toggle" aria-label="Toggle dark mode"><i class="bi bi-moon-fill icon-moon"></i><i class="bi bi-sun-fill icon-sun"></i></button>
        <a href="index.html" style="font-size:var(--font-size-sm);color:var(--muted);"><i class="bi bi-arrow-left"></i> Back to Store</a>
      </div>
    </div>
  </header>

  <main id="main-content" class="auth-main">
    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">
        <div class="logo-icon" style="width:44px;height:44px;font-size:1.5rem;"><i class="bi bi-stars"></i></div>
        <span style="font-family:var(--font-serif);font-size:1.625rem;font-weight:700;color:var(--text-dark);">Festi<span style="color:var(--primary);">vo</span></span>
      </div>

      <h1 class="auth-heading">Create Your Account</h1>
      <p class="auth-subtitle">Join Festivo and make every celebration unforgettable</p>

      <!-- Perks -->
      <div class="perks-strip">
        <div class="perk-item"><i class="bi bi-tag-fill"></i><span>Exclusive Member Discounts</span></div>
        <div class="perk-item"><i class="bi bi-truck"></i><span>Free Delivery on ₹999+</span></div>
        <div class="perk-item"><i class="bi bi-heart-fill"></i><span>Save Your Wishlists</span></div>
      </div>

      <!-- Register Form -->
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="regName">Full Name <span class="required">*</span></label>
          <div class="input-group">
            <span class="input-icon"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="regName" name="name" placeholder="Priya Sharma" data-validate="required|min:2" data-label="Full Name" autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address <span class="required">*</span></label>
          <div class="input-group">
            <span class="input-icon"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="regEmail" name="email" placeholder="priya@example.com" data-validate="required|email" data-label="Email" autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPhone">Phone Number <span class="required">*</span></label>
          <div class="input-group">
            <span class="input-icon"><i class="bi bi-telephone"></i></span>
            <input type="tel" class="form-control" id="regPhone" name="phone" placeholder="+91 98765 43210" data-validate="required|phone" data-label="Phone" autocomplete="tel">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password <span class="required">*</span></label>
          <div class="password-field">
            <input type="password" class="form-control" id="regPassword" name="password" placeholder="Create a strong password" data-validate="required|min:8" data-label="Password" data-show-strength="true" autocomplete="new-password">
            <button type="button" class="toggle-pw" id="toggleRegPw" aria-label="Show/hide password"><i class="bi bi-eye"></i></button>
          </div>
          <!-- Strength Indicator -->
          <div class="strength-bar" id="strengthBar">
            <div class="strength-bar-seg" id="seg1"></div>
            <div class="strength-bar-seg" id="seg2"></div>
            <div class="strength-bar-seg" id="seg3"></div>
            <div class="strength-bar-seg" id="seg4"></div>
          </div>
          <p class="strength-label" id="strengthLabel"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Confirm Password <span class="required">*</span></label>
          <div class="password-field">
            <input type="password" class="form-control" id="regConfirmPassword" name="confirm_password" placeholder="Repeat your password" data-validate="required|match:password" data-label="Confirm Password" autocomplete="new-password">
            <button type="button" class="toggle-pw" id="toggleConfirmPw" aria-label="Show/hide password"><i class="bi bi-eye"></i></button>
          </div>
        </div>

        <div class="terms-check">
          <input type="checkbox" class="form-check-input" id="agreeTerms" name="terms" data-validate="checked" data-label="Terms & Conditions">
          <label class="form-check-label" for="agreeTerms">
            I agree to the <a href="#" style="color:var(--primary);font-weight:600;">Terms &amp; Conditions</a> and <a href="#" style="color:var(--primary);font-weight:600;">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">
          <i class="bi bi-person-plus-fill"></i> Create Account
        </button>
      </form>

      <p class="auth-footer-link">
        Already have an account? <a href="login.html">Sign in →</a>
      </p>
    </div>
  </main>

  <!-- Auth Footer -->
  <footer style="background:var(--white);border-top:1px solid var(--border);padding:1rem 1.5rem;text-align:center;">
    <p style="font-size:var(--font-size-xs);color:var(--muted);">© 2024 Festivo Decor &nbsp;·&nbsp; <a href="#" style="color:var(--muted);">Privacy Policy</a> &nbsp;·&nbsp; <a href="#" style="color:var(--muted);">Terms of Service</a></p>
  </footer>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/validation.js"></script>
  <script>
    // Show/hide password toggles
    function setupToggle(btnId, inputId) {
      document.getElementById(btnId).addEventListener('click', function() {
        const inp = document.getElementById(inputId);
        const isText = inp.type === 'text';
        inp.type = isText ? 'password' : 'text';
        this.querySelector('i').className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
      });
    }
    setupToggle('toggleRegPw', 'regPassword');
    setupToggle('toggleConfirmPw', 'regConfirmPassword');

    // Password strength bar (register page only)
    document.getElementById('regPassword').addEventListener('input', function() {
      const pw = this.value;
      let score = 0;
      if (pw.length >= 8) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      const levels = [null, 'weak', 'fair', 'good', 'strong'];
      const labels = [null, 'Weak 😟', 'Fair 😐', 'Good 👍', 'Strong 💪'];
      const segs   = document.querySelectorAll('.strength-bar-seg');
      const label  = document.getElementById('strengthLabel');
      segs.forEach((seg, i) => {
        seg.className = 'strength-bar-seg' + (i < score && pw ? ' ' + levels[score] : '');
      });
      label.textContent = pw ? (labels[score] || '') : '';
      label.className   = 'strength-label' + (pw ? ' ' + (levels[score] || '') : '');
    });

    // Redirect already-logged-in users away from register
    document.addEventListener('DOMContentLoaded', () => {
      if (window.FestivoAuth?.isLoggedIn()) {
        window.location.replace('customer-dashboard.html');
      }
    });
  </script>
</body>
</html>
